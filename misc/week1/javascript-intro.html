<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Blank Document Showing where Javascript goes</title>
    
    <script>
        // Javascript goes here
        let name = "Patrick";   // let is an adjustable variable

        name = "Beans on Toast Man";

        const nameOfSchool = "BYUI";    // const is an unchangable variable. 

        nameOfSchool = "Morris"     // Since JS isn't a compiled language, most 
                        // IDEs won't catch attempts to change a const by default
    </script>

</head>
<body>
    
</body>
</html>
