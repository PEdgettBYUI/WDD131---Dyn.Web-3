<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A Demo site of forms and form validation using an Event Ticket framework.">
    <meta name="author" content="Patrick T. Edgett">
    
    <link rel="stylesheet" href="eventform.css">
    <script src="eventform.js" defer></script>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <title>Event Ticket | PTE</title>
</head>

<body>
    <form id="ticketForm">
      <div class="field">
        <label for="firstName">First Name</label>
        <input id="firstName" name="firstName" type="text" required />
      </div>

      <div class="field">
        <label for="lastName">Last Name</label>
        <input id="lastName" name="lastName" type="text" required />
      </div>

      <div class="field full">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
      </div>

      <div class="field">
        <label for="type">Type</label>
        <select
          id="type"
          name="type"
          aria-controls="notesContainer"
          required
        >
          <option value="">Choose one</option>
          <option value="student">Student</option>
          <option value="guest">Guest</option>
        </select>
      </div>

      <div class="field">
        <label for="eventDate">Event Date</label>
        <input id="eventDate" name="eventDate" type="date" required />
      </div>

      <div class="codes">
        <div class="studentId">
            <label for="studentId">Student #</label>
            <input id="studentId" name="studentId" type="number" />
        </div>

        <div class="guestAccess">
            <label for="guestAccess">Access Code</label>
            <input id="guestAccess" name="guestAccess" type="text" required />
        </div>
      </div>

      <button class="full" type="submit">Create Ticket</button>
      
      <div class="submissionOutput"></div>
    </form>
</body>
</html>
